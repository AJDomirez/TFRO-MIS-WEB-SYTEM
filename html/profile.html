<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TFRO Profile</title>

  <link rel="stylesheet" href="../css/profile.css">

  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
  />
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  
<aside class="sidebar">

  <div class="logo">
    <i class="ri-government-line"></i>

<div>
  <h2>TFRO</h2>
  <p>Lucena City</p>
</div>

  </div>

 
<ul class="menu">

  <li id="dashboardMenu">
    <a href="dashboard.html">
      <i class="ri-dashboard-line"></i>
      Dashboard
    </a>
  </li>

  <li id="franchiseMenu">
    <a href="franchise.html">
      <i class="ri-file-list-3-line"></i>
      Franchises
    </a>
  </li>

  <li id="operatorMenu">
    <a href="operator.html">
      <i class="ri-user-star-line"></i>
      Operators
    </a>
  </li>

  <li id="driverMenu">
    <a href="driver.html">
      <i class="ri-steering-2-line"></i>
      Drivers
    </a>
  </li>

  <li id="violationMenu">
    <a href="violation.html">
      <i class="ri-alert-line"></i>
      Violations
    </a>
  </li>

  <li id="paymentMenu">
    <a href="payment.html">
      <i class="ri-money-dollar-circle-line"></i>
      Payments
    </a>
  </li>

  <li id="reportMenu">
    <a href="report.html">
      <i class="ri-bar-chart-line"></i>
      Reports
    </a>
  </li>

  <li id="notificationMenu">
        <a href="notification.html">
          <i class="ri-notification-3-line"></i>
          Notifications
        </a>
      </li>

  <li id="auditlogMenu"> 
        <a href="auditlog.html"> 
        <i class="ri-history-line">
            </i> Audit Log </a> 
    </li>

    <li class="active">
        <a href="profile.html">
        <i class="ri-user-settings-line"></i>
          Profile
        </a>
    </li>

    </ul>

    <!-- USER PROFILE -->
<div class="sidebar-user">

  <div class="user-left">

    <div class="user-avatar" id="userAvatar">
      MS
    </div>

    <div class="user-details">
      <h4 id="userName">Administrator</h4>
      <p id="userRole">Administrator</p>
    </div>

  </div>

  <button class="logout-btn" id="logoutBtn">
    <i class="ri-logout-box-r-line"></i>
  </button>

</div>

  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">

      <div>
        <h1>My Profile</h1>
        <p>Manage your account information and password</p>
      </div>

    </header>

    <!-- CONTENT -->
    <div class="content">

      <!-- TABS -->
      <div class="tabs">

        <button class="tab-btn active" onclick="showTab('profile')">
          Profile Info
        </button>

        <button class="tab-btn" onclick="showTab('password')">
          Change Password
        </button>

      </div>

      <!-- PROFILE TAB -->
      <div class="card tab-content active" id="profileTab">

        <div class="profile-header">

          <div class="profile-avatar" id="profileAvatar">
            M
          </div>

          <div>
            <h2 id="profileName">Administrator</h2>
            <p id="profileRole">Administrator</p>
            <span id="profileEmail">—</span>
          </div>

        </div>

        <form id="profileForm">

          <div class="grid">

            <div class="input-group">
              <label>First Name</label>
              <input type="text" id="firstName">
            </div>

            <div class="input-group">
              <label>Last Name</label>
              <input type="text" id="lastName">
            </div>

          </div>

          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" disabled>
          </div>

          <div class="input-group">
            <label>Contact Number</label>
            <input type="text" id="contactNumber">
          </div>

          <div class="input-group">
            <label>Role</label>
            <input type="text" id="role" disabled>
          </div>

          <button type="submit" class="save-btn">
            Save Changes
          </button>

        </form>

      </div>

      <!-- PASSWORD TAB -->
      <div class="card tab-content" id="passwordTab">

        <form id="passwordForm">

          <div class="input-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword">
          </div>

          <div class="input-group">
            <label>New Password</label>
            <input type="password" id="newPassword">
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword">
          </div>

          <button type="submit" class="save-btn">
            Update Password
          </button>

        </form>

      </div>

    </div>

  </main>

</div>

<script type="module" src="../js/profile.js"></script>

<script>

  const role = localStorage.getItem("role");

  const paymentMenu =
    document.getElementById("paymentMenu");

  if(role === "admin"){
    paymentMenu.style.display = "none";
  }

</script>

</body>
</html>
