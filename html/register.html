<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TFRO Register</title>

  <link rel="stylesheet" href="../css/style.css">

  <!-- Remix Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
  />
</head>
<body>

<div class="container">

  <div class="left-panel">

<a href="index.html" class="logo" style="text-decoration:none;cursor:pointer;">
      <div class="logo-icon">
        <img class="auth-tfro-logo" src="../Logo/TFRO Logo.jpg" alt="TFRO Logo" />
      </div>

      <div>
        <h2>TFRO MIS</h2>
        <p>Lucena City</p>
      </div>
    </a>

    <div class="hero">
      <h1>Create Your TFRO Account</h1>

      <p>
        Register as a tricycle operator or driver to access franchise records,
        compliance status, and payment transactions.
      </p>
    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel register-panel">

    <div class="login-box register-box">

      <h2>Sign Up</h2>
      <p>Create a new TFRO account</p>

      <form id="registerForm">

        <!-- ROLE SELECTOR -->
        <div class="input-group">
          <label>I am a...</label>

          <div class="role-selector">

            <label class="role-card">
              <input type="radio" name="role" value="driver" required />
              <div class="role-card-inner">
                <i class="ri-user-line"></i>
                <strong>Driver</strong>
                <span>Operate a tricycle unit</span>
              </div>
            </label>

            <label class="role-card">
              <input type="radio" name="role" value="operator" />
              <div class="role-card-inner">
                <i class="ri-focus-3-line"></i>
                <strong>Operator</strong>
                <span>Own a franchise</span>
              </div>
            </label>

          </div>
        </div>

        <div class="input-group">
          <label>Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Juan Dela Cruz"
            required
          />
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@email.com"
            required
          />
        </div>

        <div class="input-group">
          <label>Contact Number</label>
          <input
            type="tel"
            id="contactNumber"
            placeholder="09XX-XXX-XXXX"
            pattern="[0-9+\-\s()]{7,15}"
            required
          />
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Create a password"
              minlength="6"
              required
            />

            <button type="button" class="toggle-pass" data-target="password">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <div class="password-box">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repeat your password"
              required
            />

            <button type="button" class="toggle-pass" data-target="confirmPassword">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="registerBtn">
          <i class="ri-user-add-line"></i>
          Create Account
        </button>

        <span class="switch-link">
Already have an account?
          <a href="login.html">Sign in here</a>
        </span>

      </form>

    </div>

    <!-- Animated decorative tricycle — confined to the registration
         area (bottom-right), straight horizontal movement only, and
         it never affects the form's layout or creates page overflow. -->
    <div class="trike-scene" aria-hidden="true">
      <div class="tricycle" id="driveTricycle">
        <img
          class="trike-asset"
          src="../Tricycle Image.png"
          alt="TFRO Philippine Tricycle"
          draggable="false"
        />
      </div>
    </div>

  </div>

</div>

<script type="module" src="../js/register.js"></script>
<script src="../js/trike-drive.js"></script>

</body>
</html>
