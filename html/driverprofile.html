<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver Profile</title>

<link rel="stylesheet" href="../css/driverprofile.css">
  <link rel="stylesheet" href="../css/tfro-theme.css">

  <!-- Remix Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
  />
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- LOGO -->
<div class="logo">
      <img class="sidebar-logo" src="../Logo/TFRO Logo.jpg" alt="TFRO Logo" />

      <div>
        <h2>TFRO MIS</h2>
        <p>Lucena City</p>
      </div>
    </div>

    <!-- MENU -->
    <ul class="menu">

      <li>
        <a href="driverportal.html">
          <i class="ri-file-list-3-line"></i>
          My Records
        </a>
      </li>

      <li class="active">
        <a href="driverprofile.html">
          <i class="ri-user-settings-line"></i>
          My Profile
        </a>
      </li>

    </ul>

    <!-- USER -->
    <div class="user-section">

      <div class="user-profile">

        <div class="avatar" id="userAvatar">
          RL
        </div>

        <div class="user-info">
          <h4 id="userName">Driver</h4>
          <p>Driver</p>
        </div>

      </div>

      <button class="logout-btn" id="logoutBtn">
        <i class="ri-logout-box-r-line"></i>
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">

      <div>
        <h1>My Profile</h1>
        <p>Manage your account information and security settings</p>
      </div>

      <div class="top-right">

        <span class="date"></span>

        <button class="notif-btn" id="notificationsBtn" type="button" aria-label="View notifications">
          <i class="ri-notification-3-line"></i>
        </button>

        <div class="top-user">

          <div class="top-avatar" id="topAvatar">
            RL
          </div>

          <span id="topUserName">Driver</span>

        </div>

      </div>

    </header>

    <!-- CONTENT -->
    <div class="content">

      <!-- TABS -->
      <div class="tabs">

        <button class="tab active" data-tab="profile">
          Profile Info
        </button>

        <button class="tab" data-tab="password">
          Change Password
        </button>

      </div>

      <!-- PROFILE CARD -->
      <div class="profile-card">

        <div class="profile-header">

          <div class="big-avatar" id="bigAvatar">
            RL
          </div>

          <div>
            <h2 id="profileName">Driver</h2>
            <p>Driver</p>
            <span id="profileEmail">—</span>
          </div>

        </div>

        <!-- FORM -->
        <form id="profileForm">

          <div class="form-grid">

            <div class="input-group">
              <label>First Name</label>
              <input type="text" id="firstName">
            </div>

            <div class="input-group">
              <label>Last Name</label>
              <input type="text" id="lastName">
            </div>

          </div>

          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" disabled>
          </div>

          <div class="input-group">
            <label>Contact Number</label>
            <input type="text" id="contactNumber">
          </div>

          <div class="input-group">
            <label>Role</label>
            <input type="text" id="role" disabled>
          </div>

          <button type="submit" class="save-btn">
            Save Changes
          </button>

        </form>

        <!-- CHANGE PASSWORD FORM -->
        <form id="passwordForm" class="hidden">

          <h3>Change Password</h3>

          <p class="form-hint">
            Enter your current password, then choose a new one. You will be
            signed in again with your new password.
          </p>

          <div class="input-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" placeholder="Enter current password" required>
          </div>

          <div class="input-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" minlength="6" required>
          </div>

          <div class="input-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat new password" required>
          </div>

          <button type="submit" class="save-btn">
            Update Password
          </button>

        </form>

      </div>

    </div>

  </main>

</div>

<script type="module" src="../js/driverprofile.js"></script>

</body>
</html>
