<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formal Profile Picture · TFRO</title><link rel="stylesheet" href="../css/profilephoto.css"><link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"></head><body><main><section><img class="logo" src="../Logo/TFRO Logo.jpg" alt="TFRO logo"><span class="eyebrow">IDENTITY REQUIREMENT</span><h1>Submit Your Formal Profile Picture</h1><p>Operators and Traffic Enforcers must provide a clear identification photo before entering the system.</p><form id="profilePhotoForm"><label class="upload-box" for="profilePhotoInput"><i class="ri-image-add-line"></i><strong>Select formal photo</strong><span>Recent, front-facing JPG, PNG, or WebP · Maximum 5 MB</span><input id="profilePhotoInput" type="file" accept="image/jpeg,image/png,image/webp" required></label><img id="profilePhotoPreview" alt="Selected formal profile preview" hidden><p id="profilePhotoMessage" hidden></p><button id="saveProfilePhoto" type="submit"><i class="ri-shield-check-line"></i> Save Photo & Continue</button></form></section></main><script type="module" src="../js/profilephoto.js"></script></body></html>
