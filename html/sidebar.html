<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TFRO Layout</title>

  <link rel="stylesheet" href="../css/sidebar.css">

  <!-- Remix Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
  />
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <!-- LOGO -->
    <div class="logo-section">

      <div class="logo">

        <div class="logo-icon">
          <i class="ri-government-line"></i>
        </div>

        <div class="logo-text">
          <h2>TFRO</h2>
          <p>Lucena City</p>
        </div>

      </div>

      <button class="toggle-btn" id="toggleBtn">
        <i class="ri-layout-left-line"></i>
      </button>

    </div>

    <!-- MENU -->
    <nav class="menu">

      <a href="dashboard.html" class="menu-item active">
        <i class="ri-dashboard-3-line"></i>
        <span>Dashboard</span>
      </a>

      <a href="franchise.html" class="menu-item">
        <i class="ri-file-list-3-line"></i>
        <span>Franchises & Renewal</span>
      </a>

      <a href="operator.html" class="menu-item">
        <i class="ri-user-star-line"></i>
        <span>Operators</span>
      </a>

      <a href="driver.html" class="menu-item">
        <i class="ri-steering-2-line"></i>
        <span>Drivers</span>
      </a>

      <a href="violation.html" class="menu-item">
        <i class="ri-alert-line"></i>
        <span>Violations</span>
      </a>

      <!-- STAFF ONLY -->
      <a href="payment.html" class="menu-item" id="paymentMenu">
        <i class="ri-money-dollar-circle-line"></i>
        <span>Payments</span>
      </a>

      <a href="report.html" class="menu-item">
        <i class="ri-bar-chart-box-line"></i>
        <span>Reports</span>
      </a>

      <a href="notification.html" class="menu-item">
        <i class="ri-notification-3-line"></i>
        <span>Notifications</span>
      </a>

      <a href="auditlog.html" class="menu-item active">
        <i class="ri-history-line"></i>
        <span>Audit Log</span>
      </a>

      <a href="profile.html" class="menu-item active">
        <i class="ri-user-settings-line"></i>
        <span>Profile</span>
      </a>

    </nav>

    <!-- USER SECTION -->
    <div class="user-section">

  <button class="logout-btn" id="logoutBtn">
    <i class="ri-logout-box-r-line"></i>
    <span>Logout</span>
  </button>

</div>

  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">

      <div>
        <h1>Dashboard</h1>
        <p>Welcome back Administrator</p>
      </div>

      <div class="top-actions">

        <div class="date">
          Monday, May 16, 2026
        </div>

        <button class="notification-btn">
          <i class="ri-notification-3-line"></i>
          <span class="notif-dot"></span>
        </button>

        <div class="profile">

          <div class="profile-avatar">
            A
          </div>

          <span>Administrator</span>

        </div>

      </div>

    </header>

    <!-- CONTENT -->
    <div class="content">

      <div class="card">
        Dashboard Content Here
      </div>

    </div>

  </main>

</div>


<script src="../js/sidebar.js"></script>


<script>

  const role = localStorage.getItem("role");

  alert(role);

  const paymentMenu =
    document.getElementById("paymentMenu");

  if(role === "admin"){
    paymentMenu.style.display = "none";
  }

</script>



</body>
</html>
