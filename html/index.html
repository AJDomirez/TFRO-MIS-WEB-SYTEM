<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TFRO Login</title>

  <link rel="stylesheet" href="../css/style.css">

  <!-- Remix Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
  />
</head>
<body>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="left-panel">

    <div class="logo">
      <div class="logo-icon">
        <i class="ri-government-line"></i>
      </div>

      <div>
        <h2>TFRO</h2>
        <p>Lucena City</p>
      </div>
    </div>

    <div class="hero">
      <h1>Tricycle Franchising & Regulatory Management</h1>

      <p>
        A centralized digital platform for the TFRO of Lucena City to manage
        franchise applications, operator records, driver compliance,
        violations, and payment transactions.
      </p>
    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

    <div class="login-box">

      <h2>Welcome Back</h2>
      <p>Sign in to your TFRO account</p>

      <form id="loginForm">

        <div class="input-group">
          <label>Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@tfro.gov.ph"
            required
          />
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />

            <button type="button" id="togglePassword">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn">
          <i class="ri-login-box-line"></i>
          Sign In
        </button>

      </form>

      <div class="demo-section">

        <h4>Demo Accounts</h4>

        <button class="demo-btn" onclick="fillDemo('admin')">
          Administrator
        </button>

        <button class="demo-btn" onclick="fillDemo('staff')">
          TFRO Staff
        </button>

        <button class="demo-btn" onclick="fillDemo('operator')">
          Operator
        </button>

        <button class="demo-btn" onclick="fillDemo('driver')">
          Driver
        </button>

      </div>

    </div>

  </div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
