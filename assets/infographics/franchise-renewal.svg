<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
<defs><style>.bg{fill:#f4f7fb}.navy{fill:#123f73}.blue{fill:#1767a8}.gold{fill:#f4c430}.ink{fill:#18324b}.muted{fill:#60758a}.white{fill:#fff}.line{stroke:#d9e3ed;stroke-width:3}.title{font:800 58px Arial,sans-serif}.subtitle{font:500 24px Arial,sans-serif}.step{font:700 24px Arial,sans-serif}.body{font:400 18px Arial,sans-serif}.small{font:400 17px Arial,sans-serif}.number{font:800 24px Arial,sans-serif}</style></defs>
<rect class="bg" width="1200" height="1800"/><rect class="navy" width="1200" height="315"/><rect class="gold" y="300" width="1200" height="15"/><circle cx="1040" cy="150" r="108" fill="#fff" opacity=".08"/>
<text x="76" y="68" fill="#f4c430" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">GABAY PARA SA OPERATOR • LUCENA CITY</text><text x="76" y="157" fill="#fff" class="title">RENEWAL NG</text><text x="76" y="222" fill="#fff" class="title">PRANGKISA</text><text x="78" y="270" fill="#deebf7" class="subtitle">Mula online na aplikasyon hanggang paglabas ng bagong MTOP.</text>
<rect x="68" y="350" width="1064" height="118" rx="22" class="white"/><text x="100" y="396" class="blue" font-family="Arial" font-size="19" font-weight="700">KAILAN PUWEDENG MAG-RENEW?</text><text x="100" y="436" class="ink" font-family="Arial" font-size="23" font-weight="700">Hanggang 3 buwan bago mag-expire ang prangkisa.</text>
<text x="76" y="535" class="ink" font-family="Arial" font-size="22" font-weight="700">ANG PROSESO</text><line x1="106" y1="592" x2="106" y2="1272" class="line"/>
<g font-family="Arial"><circle cx="106" cy="610" r="27" class="blue"/><text x="99" y="619" fill="#fff" class="number">1</text><text x="158" y="602" class="ink step">Mag-sign in at buksan ang “Franchise Renewal”</text><text x="158" y="635" class="muted body">Pumili ng kaso: regular, expired OR, o change motor.</text>
<circle cx="106" cy="730" r="27" class="blue"/><text x="99" y="739" fill="#fff" class="number">2</text><text x="158" y="722" class="ink step">Suriin ang detalye ng operator</text><text x="158" y="755" class="muted body">Ilagay ang tirahan, petsa at lugar ng kapanganakan, at civil status.</text>
<circle cx="106" cy="850" r="27" class="blue"/><text x="99" y="859" fill="#fff" class="number">3</text><text x="158" y="842" class="ink step">Kumpletuhin ang sasakyan at driver</text><text x="158" y="875" class="muted body">Piliin ang rehistradong driver; tiyakin ang motor, plate, engine, chassis, OR/CR.</text>
<circle cx="106" cy="970" r="27" class="blue"/><text x="99" y="979" fill="#fff" class="number">4</text><text x="158" y="962" class="ink step">I-upload ang malinaw na requirements</text><text x="158" y="995" class="muted body">Voter’s Certificate, Cedula, Barangay Clearance, lisensya, 2×2, PMBL.</text><text x="158" y="1025" class="muted body">Regular: idagdag ang updated For Hire OR at liability insurance.</text>
<circle cx="106" cy="1090" r="27" class="blue"/><text x="99" y="1099" fill="#fff" class="number">5</text><text x="158" y="1082" class="ink step">Isumite at subaybayan ang status</text><text x="158" y="1115" class="muted body">Itama at muling isumite kung may hinihinging correction ang TFRO.</text>
<circle cx="106" cy="1210" r="27" class="blue"/><text x="99" y="1219" fill="#fff" class="number">6</text><text x="158" y="1202" class="ink step">Dalhin ang originals sa TFRO para sa beripikasyon</text><text x="158" y="1235" class="muted body">Dalhin din ang valid ID at unit para sa inspeksyon. Hintayin ang assessment.</text>
<circle cx="106" cy="1330" r="27" class="blue"/><text x="99" y="1339" fill="#fff" class="number">7</text><text x="158" y="1322" class="ink step">Bayaran ang assessment at kunin ang naaprubahang MTOP</text><text x="158" y="1355" class="muted body">Sundin ang abiso ng TFRO para sa bayad, release, at mga dokumentong ipi-print.</text></g>
<rect x="68" y="1420" width="1064" height="270" rx="26" class="white"/><rect x="68" y="1420" width="14" height="270" rx="7" class="gold"/><g font-family="Arial"><text x="108" y="1475" class="navy" font-size="22" font-weight="700">I-SCAN PARA MAG-SIGN IN SA TFRO MIS</text><text x="108" y="1517" class="muted small">Dito magsisimula ang aplikasyon at pagsubaybay ng renewal.</text><text x="108" y="1563" class="blue" font-size="17" font-weight="700">MAHALAGANG PAALALA</text><text x="108" y="1595" class="muted small">Ang pag-submit online ay hindi pa pag-apruba. Kumpletuhin ang</text><text x="108" y="1624" class="muted small">beripikasyon, inspeksyon, assessment, at bayad ayon sa TFRO.</text></g><g transform="translate(825 1435)"><rect width="240" height="240" rx="10" fill="#fff" stroke="#d9e3ed" stroke-width="2"/><image href="tfro-mis-qr.svg" x="10" y="10" width="220" height="220"/></g>
<text x="600" y="1740" text-anchor="middle" class="muted" font-family="Arial" font-size="16">TFRO-LUCENA MIS • FRANCHISE RENEWAL QUICK GUIDE</text></svg>

