<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f3f7f5;font-family:Arial,sans-serif;color:#173d2e">
    <div style="max-width:560px;margin:32px auto;background:#fff;border:1px solid #d9e7df;border-radius:14px;overflow:hidden">
      <div style="padding:22px 28px;background:#0b5c41;color:#fff;border-bottom:4px solid #f4c430">
        <h1 style="margin:0;font-size:22px">TFRO MIS Operator Recovery</h1>
        <p style="margin:7px 0 0">Lucena City</p>
      </div>
      <div style="padding:28px">
        <h2 style="margin-top:0">Verify your email</h2>
        <p>Enter this six-digit code on the TFRO password recovery form:</p>
        <p style="margin:24px 0;padding:16px;text-align:center;border-radius:10px;background:#eef8f3;font-size:32px;font-weight:800;letter-spacing:8px;color:#0b5c41">{{ .Token }}</p>
        <p>This code is for the Operator account registered to <strong>{{ .Email }}</strong>.</p>
        <p style="font-size:13px;color:#63766d">If you did not request a password reset, do not share this code and ignore this email.</p>
      </div>
    </div>
  </body>
</html>
